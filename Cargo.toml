[workspace]
resolver = "2"
members = ["cli", "runtime", "recorder", "replay", "fault", "intercept"]

[workspace.package]
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
rand = "0.8"
